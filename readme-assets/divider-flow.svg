<svg width="1200" height="12" viewBox="0 0 1200 12" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="offset" values="-1;1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#818CF8">
        <animate attributeName="offset" values="-0.7;1.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#C084FC">
        <animate attributeName="offset" values="-0.45;1.55" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#67E8F9">
        <animate attributeName="offset" values="-0.2;1.8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="offset" values="0;2" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="5" width="1200" height="2" rx="1" fill="#1F2937"/>
  <rect x="0" y="4" width="1200" height="4" rx="2" fill="url(#flow)" filter="url(#softGlow)"/>
</svg>
